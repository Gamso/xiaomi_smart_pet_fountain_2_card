name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # HACS serves the committed bundle: fail if it is not the output of the
      # committed sources.
      - name: Check that dist/ is up to date
        run: |
          if ! git diff --exit-code --stat -- dist/; then
            echo "::error::dist/ differs from a fresh build: run 'npm run build' and commit dist/."
            exit 1
          fi
          test -z "$(git status --porcelain dist/)"

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hacs/action@main
        with:
          category: plugin
          ignore: brands
